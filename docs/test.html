<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOOPCOURSE - テストスイート & ベンチマーク</title>
  <meta name="description" content="ループコースパズル（LoopCourse）のソルバー・ジェネレータのブラウザ専用自動テスト・パフォーマンス測定ツール">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    /* Neon Dark Theme */
    :root {
      --bg-primary: #0a0d14;
      --bg-secondary: #121824;
      --bg-card: rgba(22, 28, 45, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      
      --neon-cyan: #00f2fe;
      --neon-blue: #4facfe;
      --neon-green: #10b981;
      --neon-red: #ef4444;
      --neon-amber: #f59e0b;
      
      --font-display: 'Outfit', 'Noto Sans JP', sans-serif;
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-display);
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: scroll;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(79, 172, 254, 0.04) 0%, transparent 45%),
        radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.04) 0%, transparent 45%);
    }

    .test-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Header */
    .app-header {
      text-align: center;
      margin-bottom: 10px;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 6px;
      background: linear-gradient(to right, #ffffff, #a1a1aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .neon-text {
      background: linear-gradient(to right, var(--neon-cyan), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.4));
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    /* Links */
    .nav-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    .nav-link {
      color: var(--neon-cyan);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: var(--transition-smooth);
      border-bottom: 1px dashed transparent;
      padding-bottom: 2px;
    }

    .nav-link:hover {
      color: var(--neon-blue);
      border-color: var(--neon-blue);
      text-shadow: 0 0 8px rgba(79, 172, 254, 0.3);
    }

    /* Control Panel & Dashboards */
    .control-panel, .test-results-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .panel-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
      border-left: 3px solid var(--neon-cyan);
      padding-left: 10px;
      letter-spacing: 0.5px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .metric-card {
      background: rgba(10, 13, 20, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .metric-card:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .metric-value.pass {
      color: var(--neon-green);
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }

    .metric-value.fail {
      color: var(--neon-red);
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
    }

    .metric-value.pending {
      color: var(--text-muted);
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 20px;
      display: none;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, var(--neon-cyan), var(--neon-blue));
      border-radius: 3px;
      box-shadow: 0 0 8px var(--neon-cyan);
      transition: width 0.1s ease;
    }

    /* Actions and Selection */
    .action-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .selector-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .selector-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    select {
      background: rgba(10, 13, 20, 0.8);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    select:focus {
      border-color: var(--neon-cyan);
    }

    .btn-run {
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-blue) 100%);
      color: #04080f;
      border: none;
      padding: 10px 24px;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition-smooth);
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-run:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
      filter: brightness(1.05);
    }

    .btn-run:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Test Results UI */
    .test-category-group {
      margin-bottom: 24px;
    }

    .test-category-group:last-child {
      margin-bottom: 0;
    }

    .category-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 6px;
    }

    .category-title span {
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: normal;
      letter-spacing: 0;
      text-transform: none;
    }

    .test-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .test-row {
      background: rgba(10, 13, 20, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .test-row:hover {
      border-color: rgba(255, 255, 255, 0.12);
      background: rgba(10, 13, 20, 0.45);
    }

    .test-row-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .test-identity {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-status {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-status.pass {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.2);
    }

    .badge-status.fail {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--neon-red);
      color: var(--neon-red);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.2);
    }

    .badge-status.pending {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--text-muted);
      color: var(--text-muted);
    }

    .badge-status.running {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--neon-amber);
      color: var(--neon-amber);
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.2);
      animation: pulse-slow 1s infinite alternate;
    }

    @keyframes pulse-slow {
      100% { filter: brightness(1.2); box-shadow: 0 0 10px var(--neon-amber); }
    }

    .test-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .test-duration {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    /* Test Detailed logs */
    .test-logs {
      display: none;
      background: rgba(5, 8, 12, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 12px;
      margin-top: 4px;
      font-family: 'Outfit', monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--text-muted);
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .test-logs.visible {
      display: block;
    }

    .log-line.info {
      color: var(--text-muted);
    }

    .log-line.success {
      color: var(--neon-green);
    }

    .log-line.error {
      color: var(--neon-red);
      font-weight: 600;
    }

    .log-line.warning {
      color: var(--neon-amber);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Loader icon */
    .loader-icon {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="test-container">
    <header class="app-header">
      <h1 class="brand-title">LOOP<span class="neon-text">TESTS</span></h1>
      <p class="brand-subtitle">Automated Test Runner & Benchmarks</p>
      <div class="nav-links">
        <a href="index.html" class="nav-link">← ゲーム画面に戻る</a>
      </div>
    </header>

    <!-- Top Dashboards / Metrics -->
    <section class="control-panel">
      <div class="panel-header">
        <h2>実行ダッシュボード</h2>
        <span id="status-badge" style="font-size: 0.75rem; color: var(--text-muted);">未実行</span>
      </div>

      <div class="dashboard">
        <div class="metric-card">
          <span class="metric-label">テスト総数</span>
          <span id="metric-total" class="metric-value pending">-</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">パスしたテスト</span>
          <span id="metric-pass" class="metric-value pass">-</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">失敗したテスト</span>
          <span id="metric-fail" class="metric-value fail">-</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">平均生成速度(7x7)</span>
          <span id="metric-bench" class="metric-value pending">-</span>
        </div>
      </div>

      <!-- Animated neon progress bar -->
      <div id="test-progress" class="progress-container">
        <div id="test-progress-bar" class="progress-bar"></div>
      </div>

      <!-- Select scope & Run button -->
      <div class="action-row">
        <div class="selector-group">
          <label for="select-scope">テスト範囲</label>
          <select id="select-scope">
            <option value="all">すべてのテスト (検証 & ベンチマーク)</option>
            <option value="solver">ソルバー論理推論 (検証のみ)</option>
            <option value="generator">ジェネレータ生成 (検証のみ)</option>
            <option value="benchmark">パフォーマンスベンチマーク</option>
          </select>
        </div>
        
        <button id="btn-run-tests" class="btn-run ripple">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <span>テストを実行</span>
        </button>
      </div>
    </section>

    <!-- Test Results Panel -->
    <section class="test-results-panel">
      <div class="panel-header">
        <h2>テスト結果一覧</h2>
        <span style="font-size: 0.75rem; color: var(--text-muted);">行をクリックすると詳細なログを表示します</span>
      </div>

      <!-- List of tests populated dynamically -->
      <div id="test-results-body">
        <div class="empty-state">
          「テストを実行」ボタンを押すと、ブラウザ内でテストプログラムが並列実行され、結果がここにリアルタイムで表示されます。
        </div>
      </div>
    </section>
  </div>

  <!-- Load files sequentially -->
  <script src="js/loopcourse.js?v=20260624_v40"></script>
  <script src="js/solver.js?v=20260624_v40"></script>
  <script src="js/hint-solver.js?v=20260624_v40"></script>
  <script src="js/generator.js?v=20260624_v40"></script>
  <script src="js/test_suite.js?v=20260624_v40"></script>
</body>
</html>
